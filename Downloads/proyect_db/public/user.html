<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users - VetNova</title>
  <head>
  <meta charset="UTF-8" />
  <title>Users</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    section {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      background-color: #f9f9f9;
    }

    h1 {
      margin-bottom: 10px;
    }

    h2 {
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }

    input {
      width: 250px;
      padding: 5px;
      margin-top: 3px;
    }

    button {
      margin-top: 10px;
      padding: 6px 12px;
      cursor: pointer;
    }

    ul {
      margin-top: 10px;
    }
  </style>

</head>
</head>
<body>
  <h1>Users Module</h1>
  <a href="/index.html">Back to Home</a>

  <section>
    <h2>Create User</h2>

    <label for="full_name">Full Name:</label><br>
    <input type="text" id="full_name"><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email"><br><br>

    <label for="phone">Phone:</label><br>
    <input type="text" id="phone"><br><br>

    <label for="address">Address:</label><br>
    <input type="text" id="address"><br><br>

    <button id="createUserBtn">Create User</button>
    <p id="createUserResult"></p>
  </section>

  <section>
    <h2>Get All Users</h2>
    <button id="getAllUsersBtn">Get All Users</button>
    <ul id="getAllUsersResult"></ul>
  </section>

  <section>
    <h2>Get User by ID</h2>
    <label for="user_id">User ID:</label><br>
    <input type="number" id="user_id"><br><br>
    <button id="getUserByIdBtn">Get User</button>
    <ul id="getUserByIdResult"></ul>
  </section>

  <section>
    <h2>Update User</h2>
    <label>User ID:</label><br>
    <input type="number" id="update_user_id"><br><br>

    <label>Full Name:</label><br>
    <input type="text" id="update_full_name"><br><br>

    <label>Email:</label><br>
    <input type="email" id="update_email"><br><br>

    <label>Phone:</label><br>
    <input type="text" id="update_phone"><br><br>

    <label>Address:</label><br>
    <input type="text" id="update_address"><br><br>

    <button id="updateUserBtn">Update User</button>
    <p id="updateUserResult"></p>
  </section>

  <section>
    <h2>Delete User</h2>
    <label>User ID:</label><br>
    <input type="number" id="delete_user_id"><br><br>

    <button id="deleteUserBtn">Delete User</button>
    <p id="deleteUserResult"></p>
  </section>

  <script src="./js/user.js"></script>
</html>
